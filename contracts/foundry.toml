[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./" }]
optimizer = true
optimizer_runs = 200
via_ir = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[rpc_endpoints]
local = "http://127.0.0.1:8545"
kite_test = "${KITE_TEST_PRC_URL}"
# Mainnet goes through a paid node, whose URL embeds an API key — so only the
# variable name belongs here; the value lives in the gitignored .env. Unset,
# `--rpc-url base` fails with "environment variable BASE_RPC_URL not found"
# rather than trying the unexpanded literal, so a missing value cannot quietly
# become a broadcast against the wrong endpoint.
#
# The public endpoint (https://mainnet.base.org) measured 4/5 on repeated calls.
# A dropped receipt poll mid-broadcast leaves a contract deployed with nothing
# written to deployment.base.json, and the re-run deploys a second copy.
base = "${BASE_RPC_URL}"
# Testnet stays public: a failed testnet broadcast costs nothing to redo, and an
# env var here would be one more required variable for no real gain.
base_sepolia = "https://base-sepolia.drpc.org"

# Explorer verification, for `forge script ... --verify` / `forge verify-contract`.
# `chain` is set explicitly rather than inferred from the section name: the
# rpc_endpoints aliases above use underscores, while Foundry's own chain alias is
# `base-sepolia`, so name-based resolution would be fragile. The API URL is
# deliberately omitted so Foundry uses its built-in endpoint per chain id and keeps
# working as the explorer's API evolves.
[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

# Test profile: opts into `vm.ffi` for the E2E precompute test
# (E2EPrecomputeTest invokes script/did_identifier.py to verify cross-language
# byte-match). Off by default to keep the security posture tight — `vm.ffi`
# lets tests run arbitrary shell commands.
[profile.test]
ffi = true

[lint]
exclude_lints = ["asm-keccak256", "unsafe-cheatcode"]