name: Indexer tests

on:
  pull_request:
    paths:
      - 'services/indexer/**'
      - '.github/workflows/indexer-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Run indexer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/indexer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/indexer/package-lock.json

      - run: npm ci

      # generated/ is gitignored, so the tests do not compile without this.
      # Unlike the resolver suite, which needs no build step at all.
      - run: npm run codegen

      - name: Run indexer tests
        run: npx graph test
