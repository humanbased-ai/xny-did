name: Deploy resolver

# Only the resolver's own files trigger this. The contracts live in the same repo
# and change far more often; without the path filter every Solidity commit would
# push an identical image and roll the pods.
#
# A push only ever rolls staging — note that k8s/xny-production/resolver.yaml is
# deliberately absent from the paths below. Production is reached exclusively by
# dispatching this workflow by hand and picking that namespace.
on:
  push:
    branches: [main]
    paths:
      - 'services/resolver/**'
      - 'k8s/xny-staging/resolver.yaml'
      - '.github/workflows/deploy-resolver.yml'
  workflow_dispatch:
    inputs:
      namespace:
        description: Namespace to deploy to
        type: choice
        default: xny-staging
        options:
          - xny-staging
          - xny-production

# Authentication is Workload Identity Federation, so no service-account key is
# stored anywhere: id-token lets the runner mint an OIDC token that GCP trades
# for short-lived credentials.
permissions:
  contents: read
  id-token: write

# One deploy at a time per namespace. Two overlapping runs would race on which
# digest the Deployment ends up pointing at — but a staging run has no reason to
# hold up a production one, so the namespace is part of the group.
concurrency:
  group: deploy-resolver-${{ inputs.namespace || 'xny-staging' }}
  cancel-in-progress: false

env:
  PROJECT_ID: humanbased-ai
  REGION: asia-southeast1
  CLUSTER: humanbased-cluster
  # On a push there is no inputs context to read, and a push means staging.
  # Everything downstream — the manifest path, the image tag prefix, the rollout
  # check — derives from this one value.
  NAMESPACE: ${{ inputs.namespace || 'xny-staging' }}
  IMAGE: asia-southeast1-docker.pkg.dev/humanbased-ai/humanbased/xny-did-resolver

jobs:
  # The repo-wide CI workflow covers the Foundry project and the Python scripts
  # only, so without this the resolver's own suite would never gate a deploy.
  test:
    name: Resolver tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/resolver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/resolver/package-lock.json

      # `ci`, not `install`, for the same reason the image uses it: install
      # exactly the lockfile, and fail if package.json has drifted from it.
      - run: npm ci

      - run: node --test

  deploy:
    name: Build, push and roll out
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A dispatch chooses its own ref, so without this anyone could pick a
      # feature branch, pick xny-production, and put unreviewed code on the
      # public endpoint with that branch's own tests as the only gate. Staging is
      # deliberately left open: deploying a branch there is the point of it.
      #
      # A failing step rather than a job-level `if:`, because a skipped job
      # reports the run as green and a refused production deploy should not look
      # like a successful one.
      #
      # The manifest check is belt and braces: kubectl writes to the namespace
      # baked into each document, not to $NAMESPACE, so a file whose contents
      # disagreed with its directory would apply somewhere the rollout check
      # below is not watching, and pass green having rolled nothing.
      - name: Guard the target
        run: |
          if [ "$NAMESPACE" = xny-production ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::xny-production can only be deployed from main; this ref is $GITHUB_REF"
            exit 1
          fi
          manifest="k8s/${NAMESPACE}/resolver.yaml"
          test -f "$manifest" || { echo "::error::no manifest at $manifest"; exit 1; }
          grep -q "namespace: ${NAMESPACE}$" "$manifest" || {
            echo "::error::$manifest does not declare namespace ${NAMESPACE}"; exit 1; }

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Needed to log docker into Artifact Registry below.
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      # Matches the tag shape the rest of the namespace uses: the namespace
      # without its xny- prefix, so staging- and production-. The tag is for
      # humans reading the registry; the rollout below pins the digest.
      - id: meta
        run: echo "tag=${NAMESPACE#xny-}-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          # The service root, not the repo root: .dockerignore only applies at
          # the context root, and the Dockerfile's COPY paths are relative to it.
          context: services/resolver
          file: services/resolver/docker/Dockerfile
          # Cluster nodes are amd64. A multi-arch build would only add minutes.
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      # Pin the digest rather than the tag: a tag can be moved, and Deployments
      # that track one can silently pull something else on the next restart.
      #
      # rollout-id makes re-running this workflow on an unchanged digest still
      # produce a new ReplicaSet, so a manual re-deploy actually rolls the pods
      # instead of doing nothing.
      - name: Apply
        run: |
          sed -e "s|PLACEHOLDER_IMAGE|${IMAGE}@${DIGEST}|" \
              -e "s|PLACEHOLDER_ROLLOUT_ID|${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}|" \
              "k8s/${NAMESPACE}/resolver.yaml" | kubectl apply -f -
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # Fails the job if the new pods never become ready, so a broken deploy
      # shows up here instead of as a red pod nobody is looking at.
      #
      # Longer than the Deployment's 600s progressDeadlineSeconds on purpose:
      # Kubernetes decides when a rollout has stalled, and this waits long enough
      # to hear that verdict rather than pre-empting it. At the 5m this used to
      # be, a two-replica rollout that needed a cold Autopilot node — sequential,
      # since maxUnavailable computes to 0 — went red while it was still
      # progressing, and a re-run would have stacked a second rollout on the
      # first.
      - name: Wait for rollout
        run: kubectl -n "$NAMESPACE" rollout status deployment/did-resolver --timeout=11m

      - name: Report
        if: always()
        run: kubectl -n "$NAMESPACE" get deploy,pod -l app=did-resolver
