name: CI

on:
  # `pull_request` covers branches under review, so scope `push` to main —
  # a bare `push:` matched both events and ran the identical job twice per PR.
  # Consequence: a branch with no open PR gets no run; use workflow_dispatch
  # if you want one before opening the PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Run forge under the `test` profile so E2EPrecomputeTest can vm.ffi-invoke
  # the off-chain Python helper. (See [profile.test] in foundry.toml.)
  FOUNDRY_PROFILE: test
  # Path to the project-local venv's interpreter. E2EPrecomputeTest reads this
  # via `vm.envString("PYTHON_BIN")`; defaults to `python3` on PATH if unset.
  PYTHON_BIN: .venv/bin/python3

# This workflow has to live at the repository root — GitHub Actions ignores
# .github/workflows anywhere else — but every `run` step below targets the
# Foundry project, so default them into contracts/ rather than prefixing each
# one. `uses` steps are unaffected, which is what actions/checkout wants.
# PYTHON_BIN above stays relative to this directory: Foundry invokes ffi from
# the project root, so `.venv/bin/python3` resolves under contracts/.
defaults:
  run:
    working-directory: contracts

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Python venv
        # Project-local venv (vs `pip install --user`): same flow works on
        # macOS dev machines with Homebrew Python 3.12+ where PEP 668 blocks
        # `--user` installs of system packages. The venv lives next to the
        # contracts dir; the E2E test reads it via PYTHON_BIN.
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r script/requirements.txt

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

  # Separate job rather than a step in the one above, so a Python failure is
  # distinguishable from a Solidity one at a glance. Needs neither Foundry nor
  # the submodule checkout — script/deployment.py has no contract dependencies.
  python:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r script/requirements-dev.txt

      - name: Run pytest
        run: |
          .venv/bin/pytest script/tests -v
        id: pytest
